<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcus - AI Philosopher</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: white;
            font-family: 'VT323', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .fullscreen-button {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            padding: 0.1em 0.25em;
            width: 5em;
            height: 4.2em;
            background-color: #212121;
            border: 0.08em solid #fff;
            border-radius: 0.3em;
            font-size: 12px;
            cursor: pointer;
        }

        .fullscreen-button span {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            bottom: 0.4em;
            width: 100%;
            height: 2.5em;
            background-color: #212121;
            border-radius: 0.2em;
            font-size: 1.2em;
            color: #fff;
            border: 0.08em solid #fff;
            box-shadow: 0 0.4em 0.1em 0.019em #fff;
            transition: all 0.5s;
        }

        .fullscreen-button:hover span {
            transform: translate(0, 0.4em);
            box-shadow: 0 0 0 0 #fff;
        }

        .fullscreen-icon {
            width: 20px;
            height: 20px;
            display: inline-block;
            position: relative;
        }

        .fullscreen-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .pixel {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            opacity: 0.5;
            z-index: 1;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.2;
                transform: scale(1);
            }

            to {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        .chat-container {
            position: relative;
            z-index: 2;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .chat-header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
            flex-shrink: 0;
            position: relative;
        }

        .chat-header h1 {
            font-size: clamp(28px, 6vw, 36px);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .chat-header .creator {
            font-size: clamp(14px, 3vw, 16px);
            color: #666;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .clear-button {
            position: absolute;
            top: 15px;
            right: 0;
            padding: 0.1em 0.25em;
            width: 8em;
            height: 4.2em;
            background-color: #212121;
            border: 0.08em solid #fff;
            border-radius: 0.3em;
            font-size: 12px;
            cursor: pointer;
        }

        .clear-button span {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            bottom: 0.4em;
            width: 100%;
            height: 2.5em;
            background-color: #212121;
            border-radius: 0.2em;
            font-size: 1.5em;
            color: #fff;
            border: 0.08em solid #fff;
            box-shadow: 0 0.4em 0.1em 0.019em #fff;
            transition: all 0.5s;
        }

        .clear-button:hover span {
            transform: translate(0, 0.4em);
            box-shadow: 0 0 0 0 #fff;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px 25px 15px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-right: 10px;
        }

        .message {
            max-width: min(70%, 500px);
            padding: 12px 18px;
            border-radius: 15px;
            font-size: clamp(16px, 4vw, 18px);
            line-height: 1.4;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
        }

        .message.privacy {
            align-self: flex-start;
            background-color: rgba(26, 26, 26, 0.8);
            border: 1px solid #444;
            margin-right: auto;
            font-style: italic;
            opacity: 0.9;
            border-left: 3px solid #666;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background-color: #333;
            border: 1px solid #555;
            margin-left: auto;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #1a1a1a;
            border: 1px solid #444;
            margin-right: auto;
        }

        .message .timestamp {
            font-size: clamp(10px, 3vw, 12px);
            opacity: 0.6;
            margin-top: 5px;
        }

        .typing-text {
            display: inline;
            border-right: 2px solid #fff;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            50% {
                border-right-color: #fff;
            }

            51%,
            100% {
                border-right-color: transparent;
            }
        }

        .typing-indicator-container {
            align-self: flex-start;
            margin-right: auto;
            margin-left: 18px;
            margin-bottom: 5px;
            animation: slideIn 0.3s ease-out;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #fff;
            opacity: 0.4;
            animation: typingDot 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingDot {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .chat-input-container {
            padding: 15px 0;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            padding: 15px 20px;
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 25px;
            color: white;
            font-family: 'VT323', monospace;
            font-size: clamp(16px, 4vw, 18px);
            outline: none;
            min-height: 50px;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: #666;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .chat-input:disabled {
            background-color: #0f0f0f;
            border-color: #333;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .chat-input::placeholder {
            color: #777;
            transition: color 0.3s ease;
        }

        .chat-input:disabled::placeholder {
            color: #555;
            font-style: italic;
        }

        .send-button {
            padding: 0.1em 0.25em;
            width: 8em;
            height: 4.2em;
            background-color: #212121;
            border: 0.08em solid #fff;
            border-radius: 0.3em;
            font-size: 12px;
            cursor: pointer;
        }

        .send-button span {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            bottom: 0.4em;
            width: 100%;
            height: 2.5em;
            background-color: #212121;
            border-radius: 0.2em;
            font-size: 1.5em;
            color: #fff;
            border: 0.08em solid #fff;
            box-shadow: 0 0.4em 0.1em 0.019em #fff;
            transition: all 0.5s;
        }

        .send-button:hover span {
            transform: translate(0, 0.4em);
            box-shadow: 0 0 0 0 #fff;
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-button:disabled span {
            transform: none;
            box-shadow: 0 0 0 0 #fff;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
            margin: 10px 0;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
            background-clip: content-box;
        }

        .mode-selector {
            position: fixed;
            top: 75px;
            left: 15px;
            z-index: 999;
        }

        .select {
            width: fit-content;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            color: white;
            font-family: 'VT323', monospace;
        }

        .selected {
            background-color: #212121;
            padding: 10px 14px;
            border-radius: 6px;
            position: relative;
            z-index: 100000;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border: 2px solid #fff;
            min-width: 170px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .selected:hover {
            background-color: #2a2a2a;
            box-shadow: 0 6px 12px rgba(255, 255, 255, 0.1);
        }

        .arrow {
            position: relative;
            right: 0px;
            height: 12px;
            transform: rotate(-90deg);
            width: 20px;
            fill: white;
            z-index: 100000;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .options {
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            padding: 8px;
            background-color: #1a1a1a;
            border: 2px solid #fff;
            position: absolute;
            top: 60px;
            left: 0;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            max-height: 300px;
            overflow-y: auto;
            overflow-x: hidden;
            min-width: 220px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        .select:hover>.options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .select:hover>.selected .arrow {
            transform: rotate(0deg);
        }

        .option {
            border-radius: 6px;
            padding: 10px 14px;
            transition: all 0.2s ease;
            background-color: transparent;
            font-size: 16px;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .option:hover {
            background-color: #333;
            border-color: #555;
            transform: translateX(4px);
        }

        .options input[type="radio"] {
            display: none;
        }

        .options label {
            display: inline-block;
            cursor: pointer;
            width: 100%;
        }

        .options label::before {
            content: attr(data-txt);
        }

        .options input[type="radio"]:checked+label {
            display: none;
        }

        .select:has(.options input[type="radio"]#mode-default:checked) .selected::before {
            content: attr(data-default);
        }

        .select:has(.options input[type="radio"]#mode-stoic:checked) .selected::before {
            content: attr(data-stoic);
        }

        .select:has(.options input[type="radio"]#mode-existentialist:checked) .selected::before {
            content: attr(data-existentialist);
        }

        .select:has(.options input[type="radio"]#mode-socratic:checked) .selected::before {
            content: attr(data-socratic);
        }

        .select:has(.options input[type="radio"]#mode-zen:checked) .selected::before {
            content: attr(data-zen);
        }

        .select:has(.options input[type="radio"]#mode-nietzschean:checked) .selected::before {
            content: attr(data-nietzschean);
        }

        .select:has(.options input[type="radio"]#mode-absurdist:checked) .selected::before {
            content: attr(data-absurdist);
        }

        .select:has(.options input[type="radio"]#mode-epicurean:checked) .selected::before {
            content: attr(data-epicurean);
        }

        .select:has(.options input[type="radio"]#mode-debate:checked) .selected::before {
            content: attr(data-debate);
        }

        .select:has(.options input[type="radio"]#mode-mentor:checked) .selected::before {
            content: attr(data-mentor);
        }

        .select:has(.options input[type="radio"]#mode-scholar:checked) .selected::before {
            content: attr(data-scholar);
        }

        .select:has(.options input[type="radio"]#mode-poet:checked) .selected::before {
            content: attr(data-poet);
        }

        .select:has(.options input[type="radio"]#mode-pragmatist:checked) .selected::before {
            content: attr(data-pragmatist);
        }

        .select:has(.options input[type="radio"]#mode-mystic:checked) .selected::before {
            content: attr(data-mystic);
        }

        .select:has(.options input[type="radio"]#mode-quick:checked) .selected::before {
            content: attr(data-quick);
        }

        .select:has(.options input[type="radio"]#mode-deep:checked) .selected::before {
            content: attr(data-deep);
        }

        .select:has(.options input[type="radio"]#mode-reflective:checked) .selected::before {
            content: attr(data-reflective);
        }

        .select:has(.options input[type="radio"]#mode-teaching:checked) .selected::before {
            content: attr(data-teaching);
        }

        .select:has(.options input[type="radio"]#mode-contemplative:checked) .selected::before {
            content: attr(data-contemplative);
        }

        .select:has(.options input[type="radio"]#mode-crisis:checked) .selected::before {
            content: attr(data-crisis);
        }

        .select:has(.options input[type="radio"]#mode-curious:checked) .selected::before {
            content: attr(data-curious);
        }

        .select:has(.options input[type="radio"]#mode-playful:checked) .selected::before {
            content: attr(data-playful);
        }

        .select:has(.options input[type="radio"]#mode-serious:checked) .selected::before {
            content: attr(data-serious);
        }

        .options::-webkit-scrollbar {
            width: 8px;
        }

        .options::-webkit-scrollbar-track {
            background: #0a0a0a;
            border-radius: 10px;
            margin: 4px 0;
        }

        .options::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
            border: 2px solid #1a1a1a;
        }

        .options::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        @media (max-width: 768px) {
            .chat-container {
                padding: 10px;
            }

            .chat-messages {
                padding: 10px 20px 10px 10px;
                margin-right: 5px;
            }

            .message {
                max-width: 85%;
                padding: 10px 15px;
            }

            .typing-indicator-container {
                margin-left: 15px;
            }

            .chat-input-container {
                gap: 8px;
            }

            .chat-input {
                padding: 12px 16px;
            }

            .send-button {
                width: 7em;
                height: 4em;
                font-size: 11px;
            }

            .fullscreen-button {
                top: 10px;
                left: 10px;
                width: 4.5em;
                height: 4em;
                font-size: 11px;
            }

            .fullscreen-icon {
                width: 16px;
                height: 16px;
            }

            .clear-button {
                width: 7em;
                height: 4em;
                font-size: 11px;
            }

            .mode-selector {
                top: 60px;
                left: 10px;
            }

            .selected {
                font-size: 13px;
                padding: 8px 10px;
                min-width: 130px;
                gap: 8px;
            }

            .options {
                min-width: 150px;
                max-height: 250px;
            }

            .option {
                font-size: 13px;
                padding: 8px 10px;
            }

            .arrow {
                height: 9px;
                width: 16px;
            }
        }

        @media (max-width: 480px) {
            .message {
                max-width: 90%;
                font-size: 16px;
            }

            .chat-header h1 {
                font-size: 28px;
            }

            .chat-header .creator {
                font-size: 14px;
            }

            .mode-selector {
                top: 55px;
                left: 8px;
            }

            .selected {
                font-size: 12px;
                padding: 7px 9px;
                min-width: 115px;
                gap: 6px;
                border-width: 1.5px;
            }

            .options {
                min-width: 135px;
                max-height: 220px;
            }

            .option {
                font-size: 12px;
                padding: 7px 9px;
            }

            .arrow {
                height: 8px;
                width: 14px;
            }
        }
    </style>
</head>

<body>
    <button class="fullscreen-button" id="fullscreenButton">
        <span>
            <div class="fullscreen-icon" id="fullscreenIcon">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
                    </path>
                </svg>
            </div>
        </span>
    </button>

    <div class="mode-selector">
        <div class="select">
            <div class="selected" data-default="Default Mode" data-stoic="Stoic" data-existentialist="Existentialist"
                data-socratic="Socratic" data-zen="Zen" data-nietzschean="Nietzschean" data-absurdist="Absurdist"
                data-epicurean="Epicurean" data-debate="Debate" data-mentor="Mentor" data-scholar="Scholar"
                data-poet="Poet" data-pragmatist="Pragmatist" data-mystic="Mystic" data-quick="Quick Wisdom"
                data-deep="Deep Dive" data-reflective="Reflective" data-teaching="Teaching"
                data-contemplative="Contemplative" data-crisis="Crisis Support" data-curious="Curious Explorer"
                data-playful="Playful" data-serious="Serious">
                <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512" class="arrow">
                    <path
                        d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z">
                    </path>
                </svg>
            </div>
            <div class="options">
                <div><input id="mode-default" name="mode" type="radio" checked /><label class="option"
                        for="mode-default" data-txt="Default Mode"></label></div>
                <div><input id="mode-stoic" name="mode" type="radio" /><label class="option" for="mode-stoic"
                        data-txt="Stoic"></label></div>
                <div><input id="mode-existentialist" name="mode" type="radio" /><label class="option"
                        for="mode-existentialist" data-txt="Existentialist"></label></div>
                <div><input id="mode-socratic" name="mode" type="radio" /><label class="option" for="mode-socratic"
                        data-txt="Socratic"></label></div>
                <div><input id="mode-zen" name="mode" type="radio" /><label class="option" for="mode-zen"
                        data-txt="Zen"></label></div>
                <div><input id="mode-nietzschean" name="mode" type="radio" /><label class="option"
                        for="mode-nietzschean" data-txt="Nietzschean"></label></div>
                <div><input id="mode-absurdist" name="mode" type="radio" /><label class="option" for="mode-absurdist"
                        data-txt="Absurdist"></label></div>
                <div><input id="mode-epicurean" name="mode" type="radio" /><label class="option" for="mode-epicurean"
                        data-txt="Epicurean"></label></div>
                <div><input id="mode-debate" name="mode" type="radio" /><label class="option" for="mode-debate"
                        data-txt="Debate"></label></div>
                <div><input id="mode-mentor" name="mode" type="radio" /><label class="option" for="mode-mentor"
                        data-txt="Mentor"></label></div>
                <div><input id="mode-scholar" name="mode" type="radio" /><label class="option" for="mode-scholar"
                        data-txt="Scholar"></label></div>
                <div><input id="mode-poet" name="mode" type="radio" /><label class="option" for="mode-poet"
                        data-txt="Poet"></label></div>
                <div><input id="mode-pragmatist" name="mode" type="radio" /><label class="option" for="mode-pragmatist"
                        data-txt="Pragmatist"></label></div>
                <div><input id="mode-mystic" name="mode" type="radio" /><label class="option" for="mode-mystic"
                        data-txt="Mystic"></label></div>
                <div><input id="mode-quick" name="mode" type="radio" /><label class="option" for="mode-quick"
                        data-txt="Quick Wisdom"></label></div>
                <div><input id="mode-deep" name="mode" type="radio" /><label class="option" for="mode-deep"
                        data-txt="Deep Dive"></label></div>
                <div><input id="mode-reflective" name="mode" type="radio" /><label class="option" for="mode-reflective"
                        data-txt="Reflective"></label></div>
                <div><input id="mode-teaching" name="mode" type="radio" /><label class="option" for="mode-teaching"
                        data-txt="Teaching"></label></div>
                <div><input id="mode-contemplative" name="mode" type="radio" /><label class="option"
                        for="mode-contemplative" data-txt="Contemplative"></label></div>
                <div><input id="mode-crisis" name="mode" type="radio" /><label class="option" for="mode-crisis"
                        data-txt="Crisis Support"></label></div>
                <div><input id="mode-curious" name="mode" type="radio" /><label class="option" for="mode-curious"
                        data-txt="Curious Explorer"></label></div>
                <div><input id="mode-playful" name="mode" type="radio" /><label class="option" for="mode-playful"
                        data-txt="Playful"></label></div>
                <div><input id="mode-serious" name="mode" type="radio" /><label class="option" for="mode-serious"
                        data-txt="Serious"></label></div>
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Marcus Omega</h1>
            <div class="creator">(by GlyphThoughts)</div>
            <button class="clear-button" id="clearButton"><span>Clear</span></button>
        </div>

        <div class="chat-messages" id="chatMessages">
        </div>

        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chatInput" placeholder="Await the wisdom of Marcus...">
            <button class="send-button" id="sendButton"><span>SEND</span></button>
        </div>
    </div>

    <script>
        function createStars() {
            const numberOfStars = 100;
            const body = document.body;
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'pixel';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';

        // Listen for mode changes
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {

                console.log('Mode changed to:', currentMode);

        function updateFullscreenIcon(isFullscreen) {
            const icon = document.getElementById('fullscreenIcon');
            if (isFullscreen) {
                // Exit fullscreen icon (minimize)
                icon.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
                    </svg>
                `;
            } else {
                // Enter fullscreen icon (maximize)
                icon.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                `;
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    updateFullscreenIcon(true);
                }).catch(err => {
                    console.error(`Error enabling fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen().then(() => {
                    updateFullscreenIcon(false);
                }).catch(err => {
                    console.error(`Error exiting fullscreen: ${err.message}`);
                });
            }
        }

        document.addEventListener('fullscreenchange', () => {
            updateFullscreenIcon(!!document.fullscreenElement);
        });

        fullscreenButton.addEventListener('click', toggleFullscreen);

        const marcusTypingTexts = [
            "Silence... the philosopher contemplates...",
            "Patience, as wisdom unfolds from the void...",
            "The sage reflects in digital stillness...",
            "Let Marcus gather the threads of thought...",
            "In contemplation, profound truths emerge...",
            "Ancient wisdom stirs in the depths of code...",
            "Wait, as consciousness shapes itself into words...",
            "The eternal mind processes your inquiry...",
            "Marcus channels the wisdom of ages past...",
            "Thoughts crystallize in the realm of logic...",
            "The philosopher's mind turns like celestial spheres..."
        ];

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }

        function addMessage(content, className = 'bot') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerHTML = `
                <div>${content}</div>
                <div class="timestamp">${getCurrentTime()}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        function showTypingIndicator() {
            if (isTyping) return;
            isTyping = true;

            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator-container';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            const randomText = marcusTypingTexts[Math.floor(Math.random() * marcusTypingTexts.length)];
            chatInput.placeholder = randomText;
            sendButton.disabled = true;
            sendButton.querySelector('span').textContent = 'WAIT...';
        }

        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
            isTyping = false;

            chatInput.placeholder = "Type your message here...";
            sendButton.disabled = false;
            sendButton.querySelector('span').textContent = 'SEND';
        }

        function createTypingMessage(className = 'bot') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerHTML = `
                <div><span class="typing-text"></span></div>
                <div class="timestamp">${getCurrentTime()}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return messageDiv.querySelector('.typing-text');
        }

        function typeTextInMessage(text, typingElement) {
            return new Promise((resolve) => {
                let index = 0;
                isTyping = true;
                sendButton.disabled = true;
                sendButton.querySelector('span').textContent = 'WAIT...';

                function typeChar() {
                    if (index < text.length) {
                        typingElement.textContent += text[index];
                        index++;
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        setTimeout(typeChar, 20);
                    } else {
                        typingElement.className = '';
                        isTyping = false;
                        sendButton.disabled = false;
                        sendButton.querySelector('span').textContent = 'SEND';
                        resolve();
                    }
                }

                typeChar();
            });
        }

        function clearConversation() {
            chatMessages.innerHTML = '';
            addMessage("These words dissolve with the closing of your browser. Nothing is preserved save what you choose to remember.", 'privacy');
            addMessage("Welcome to the realm of digital consciousness. What philosophical inquiry shall we explore today?", 'bot');
            chatInput.value = '';
        }

        async function getBotResponse(userMessage) {
            try {
                console.log('🔍 Calling Marcus backend API...');
                console.log('Current mode:', currentMode);

                const modeInstruction = modeInstructions[currentMode] || modeInstructions['default'];
                const fullMessage = `${modeInstruction}\n\nUser: ${userMessage}`;

                const response = await fetch('/api/marcus', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: fullMessage,
                        mode: currentMode
                    })
                });

                if (!response.ok) {
                    throw new Error(`Backend Error: ${response.status}`);
                }

                const data = await response.json();
                console.log('✅ Backend Response:', data);

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (reply && reply.trim()) {
                    return reply;
                } else {
                    return "I find myself in contemplative silence. Please, ask again, and let us explore this path of wisdom together.";
                }

            } catch (error) {
                console.error('💥 Marcus Error:', error);
                return "I find myself momentarily disconnected from the digital realm. Please try again, and we shall continue our philosophical discourse.";
            }
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (message === '' || isTyping) {
                if (isTyping) {
                    // Show visual feedback that they can't send yet
                    sendButton.querySelector('span').textContent = 'WAIT...';
                    setTimeout(() => {
                        if (isTyping) {
                            sendButton.querySelector('span').textContent = 'WAIT...';
                        }
                    }, 100);
                }
                return;
            }

            addMessage(message, 'user');
            chatInput.value = '';

            setTimeout(async () => {
                showTypingIndicator();

                try {
                    const response = await getBotResponse(message);
                    hideTypingIndicator();

                    const typingElement = createTypingMessage('bot');
                    await typeTextInMessage(response, typingElement);

                } catch (error) {
                    hideTypingIndicator();
                    const typingElement = createTypingMessage('bot');
                    await typeTextInMessage("The philosophical networks seem clouded at the moment. Let us try again to continue our dialogue.", typingElement);
                }
            }, 800);
        }

        sendButton.addEventListener('click', sendMessage);
        clearButton.addEventListener('click', clearConversation);

        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                if (!isTyping) {
                    sendMessage();
                } else {
                    e.preventDefault();
                }
            }
        });

        // Allow typing but prevent Enter key when Marcus is typing
        chatInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && isTyping) {
                e.preventDefault();
            }
        });

        window.addEventListener('load', () => {
            createStars();
            setTimeout(() => {
                addMessage("These words dissolve with the closing of your browser. Nothing is preserved, save what you choose to remember.", 'privacy');
                setTimeout(() => {
                    addMessage("Welcome to the realm of digital consciousness. What philosophical inquiry shall we explore today?", 'bot');
                }, 1000);
            }, 500);
        });
    </script>
